[project]
name = "v-cropper-cli"
version = "0.1.0"
description = "Sports cropper: VLM-guided 9:16 vertical-crop CLI with OpenAI-compatible and AWS Bedrock support"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Qvest Group GmbH" }]
keywords = ["video", "vertical-crop", "sports", "vlm", "ffmpeg", "9:16"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "opencv-python>=4.11",
    "numpy>=2.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "openai>=1.40",
    "redis>=6.0",
    "uvicorn[standard]>=0.35",
    "boto3>=1.43.82",
]

[project.scripts]
v-cropper = "v_cropper.cli:main"
v-cropper-service = "v_cropper.service.main:main"

[project.urls]
Repository = "https://github.com/onprem-team/qvest-vertical-cropper"
Issues = "https://github.com/onprem-team/qvest-vertical-cropper/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/v_cropper"]

[dependency-groups]
dev = [
    "fakeredis>=2.31",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.21",
    # Benchmark labeling UI (eval/labeler/app.py); dev tooling, never shipped in the wheel.
    "Flask>=3.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]
# eval/score.py is a frozen, vendored scorer kept byte-identical to the R&D instance.
extend-exclude = ["eval/score.py"]

[tool.ruff.lint]
# Sensible default set: pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP), bugbear (B).
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Coverage is measured (line + branch), not gated. `live` tests hit real provider
# APIs and are opt-in only (see tests/test_live_smoke.py + VCROPPER_LIVE_TEST=1).
addopts = "-m 'not live and not slow' --cov=v_cropper --cov-branch --cov-report=term-missing"
markers = [
    "live: hits real provider APIs; needs network + credentials (opt-in)",
    "slow: long-running test",
    "integration: multi-module end-to-end test",
]
